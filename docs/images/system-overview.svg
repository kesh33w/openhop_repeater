<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Kesh OpenHop bridge: system overview</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="940" height="500" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">One Raspberry Pi, two MeshCore networks</text>
  <text x="24" y="54" fill="#475569">Blue parts are added by this fork. Every one is opt-in; with none configured, the repeater behaves like upstream.</text>

  <!-- SMF network -->
  <rect x="24" y="80" width="190" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="104" font-weight="700" fill="#0f172a">Network SMF</text>
  <text x="40" y="121" fill="#475569">909.875 MHz</text>
  <rect x="40" y="134" width="158" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/>
  <text x="50" y="151" font-weight="600" fill="#1e3a8a">g3909</text>
  <text x="50" y="166" fill="#1e3a8a" font-size="12">directional · transmits</text>
  <rect x="40" y="180" width="158" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/>
  <text x="50" y="197" font-weight="600" fill="#1e3a8a">rak909</text>
  <text x="50" y="212" fill="#1e3a8a" font-size="12">receiver (TX in a group)</text>
  <text x="40" y="250" fill="#475569" font-size="12">Local mesh nodes repeat</text>
  <text x="40" y="266" fill="#475569" font-size="12">natively, as upstream.</text>

  <!-- SFO network -->
  <rect x="726" y="80" width="190" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="742" y="104" font-weight="700" fill="#0f172a">Network SFO</text>
  <text x="742" y="121" fill="#475569">910.525 MHz</text>
  <rect x="742" y="134" width="158" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/>
  <text x="752" y="151" font-weight="600" fill="#1e3a8a">g3910</text>
  <text x="752" y="166" fill="#1e3a8a" font-size="12">directional · transmits</text>
  <rect x="742" y="180" width="158" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/>
  <text x="752" y="197" font-weight="600" fill="#1e3a8a">rak910</text>
  <text x="752" y="212" fill="#1e3a8a" font-size="12">receiver (TX in a group)</text>

  <!-- Pi -->
  <rect x="252" y="80" width="436" height="300" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="268" y="104" font-weight="700" fill="#0f172a">Raspberry Pi · openhop_repeater + openhop_core</text>

  <rect x="268" y="118" width="196" height="64" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="280" y="140" font-weight="700" fill="#1e3a8a">Topology + RF fabric</text>
  <text x="280" y="158" fill="#1e3a8a" font-size="12">per-network dedupe, provenance,</text>
  <text x="280" y="173" fill="#1e3a8a" font-size="12">ordered dual TX, antenna IDs</text>

  <rect x="476" y="118" width="196" height="64" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="488" y="140" font-weight="700" fill="#334155">Repeater engine</text>
  <text x="488" y="158" fill="#334155" font-size="12">native local repeating</text>
  <text x="488" y="173" fill="#334155" font-size="12">on each network</text>

  <rect x="268" y="196" width="404" height="66" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="280" y="218" font-weight="700" fill="#1e3a8a">Channel bridge</text>
  <text x="280" y="236" fill="#1e3a8a" font-size="12">translate mapped channels · protocol transit (DM/ACK/PATH/TRACE) ·</text>
  <text x="280" y="251" fill="#1e3a8a" font-size="12">rate limits · echo ledger · live pause · sender markers</text>

  <rect x="268" y="276" width="196" height="88" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="280" y="298" font-weight="700" fill="#334155">Web UI + API</text>
  <text x="280" y="316" fill="#334155" font-size="12">Bridge settings, diagnostics,</text>
  <text x="280" y="331" fill="#334155" font-size="12">CAD per radio, TX groups</text>
  <text x="280" y="346" fill="#334155" font-size="12">plus the fork's pages</text>

  <rect x="476" y="276" width="196" height="88" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="488" y="298" font-weight="700" fill="#1e3a8a">Integrations</text>
  <text x="488" y="316" fill="#1e3a8a" font-size="12">iLink sidecar (TLS peers)</text>
  <text x="488" y="331" fill="#1e3a8a" font-size="12">bot RF receipts (Unix socket)</text>
  <text x="488" y="346" fill="#1e3a8a" font-size="12">per-radio MQTT observers</text>

  <!-- external -->
  <rect x="252" y="410" width="200" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="264" y="434" font-weight="600" fill="#0f172a">MQTT → CoreScope</text>
  <text x="264" y="452" fill="#475569" font-size="12">one observer per radio/network</text>
  <rect x="488" y="410" width="200" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="500" y="434" font-weight="600" fill="#0f172a">iLink endpoints</text>
  <text x="500" y="452" fill="#475569" font-size="12">V4.3 TFT/OLED over the internet</text>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M214 180 H250"/>
    <path d="M690 180 H724"/>
    <path d="M352 364 V408"/>
    <path d="M588 364 V408"/>
  </g>
</svg>
